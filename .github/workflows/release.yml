name: Release

# vX.Y.Z 태그를 푸시하면 Windows용 Woodada.exe와 macOS용 .dmg(애플 실리콘·인텔)를 빌드해 GitHub 릴리즈에 올립니다.
# Windows 앱은 켜져 있는 동안 6시간마다 최신 릴리즈를 확인해 이 exe로 스스로 바꿔 끼웁니다
# (app/src/Woodada/Update/Updater.cs — 릴리즈 파일 이름 Woodada.exe가 양쪽에서 같아야 합니다).
# macOS 앱도 같은 방식으로 auto-update-mac-<arm64|x64>.zip을 받아 .app을 바꿔 끼웁니다(app/src/Woodada/Update/Updater.Mac.cs).
# workflow_dispatch로 수동 실행하면 빌드만 하고 릴리즈는 건너뜁니다 — 빌드 점검용.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # 태그 vX.Y.Z → 버전 X.Y.Z. 앱이 System.Version으로 비교하므로 이 형식만 받습니다.
  # 태그 없이 돌린 빌드 점검은 0.0.0이 되고, 그 앱은 업데이트 확인을 하지 않습니다.
  version:
    runs-on: ubuntu-latest
    outputs:
      value: ${{ steps.version.outputs.value }}
    steps:
      - name: Resolve version
        id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            if [[ ! "$GITHUB_REF_NAME" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
              echo "::error::태그는 vX.Y.Z 형식이어야 합니다: $GITHUB_REF_NAME"
              exit 1
            fi
            version="${BASH_REMATCH[1]}"
          else
            version="0.0.0"
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "version: $version"

  windows:
    needs: version
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app   # 앱 소스는 저장소의 app 폴더에 있습니다
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      # .NET 런타임까지 exe 하나에 담아(self-contained) 사용자 PC에 아무것도 설치돼 있지 않아도 실행되게 합니다.
      # 압축하면 약 46MB입니다. 리플렉션을 쓰는 UI 라이브러리라 트리밍은 하지 않습니다.
      - name: Publish Woodada.exe
        run: >
          dotnet publish src/Woodada -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -p:DebugType=none
          -p:Version=${{ needs.version.outputs.value }}
          -o publish

      - uses: actions/upload-artifact@v4
        with:
          name: Woodada-windows
          path: app/publish/Woodada.exe

  mac:
    needs: version
    runs-on: macos-latest
    strategy:
      matrix:
        rid: [osx-arm64, osx-x64]
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      # Woodada.app을 만들어 임시 서명하고 .dmg(처음 설치용)와 .zip(자동 업데이트용)으로 묶습니다.
      # 로컬 맥에서도 같은 스크립트로 만들 수 있습니다.
      - name: Build Woodada.app and .dmg
        run: bash build/mac/build-app.sh ${{ matrix.rid }} ${{ needs.version.outputs.value }}

      - uses: actions/upload-artifact@v4
        with:
          name: Woodada-${{ matrix.rid }}
          path: |
            app/publish/mac-${{ matrix.rid }}/*.dmg
            app/publish/mac-${{ matrix.rid }}/*.zip

  release:
    needs: [version, windows, mac]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 릴리즈 노트에 이전 태그 이후 커밋을 적기 위해 전체 기록과 태그를 받습니다

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # 설치 파일을 VirusTotal에 올려 백신 검사를 맡기고, 릴리즈 본문에 넣을 결과 링크(VT_SECTION.md)를 만든다.
      # 서명하지 않은 앱이라 설치 경고를 본 사용자가 안심할 수 있게 하려는 것이다.
      # VT_API_KEY 시크릿이 없으면 건너뛰고, 검사가 실패해도 릴리즈는 그대로 낸다(continue-on-error).
      - name: Scan with VirusTotal
        continue-on-error: true
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
        run: |
          set -uo pipefail
          if [ -z "${VT_API_KEY:-}" ]; then
            echo "VT_API_KEY 시크릿이 없어 VirusTotal 검사를 건너뜁니다."
            exit 0
          fi
          api=https://www.virustotal.com/api/v3
          vt() { curl -sS --fail -H "x-apikey: $VT_API_KEY" "$@"; }
          # 무료 API는 1분에 4번까지라 요청마다 16초씩 쉰다.
          pause() { sleep 16; }

          # 파일 이름|릴리즈 본문에 적을 이름. auto-update zip은 사용자가 받는 파일이 아니라 뺀다.
          files=("Woodada.exe|Windows" "Woodada-mac-arm64.dmg|macOS (애플 실리콘)" "Woodada-mac-x64.dmg|macOS (인텔)")
          declare -A analysis result

          for entry in "${files[@]}"; do
            name=${entry%%|*}
            # 32MB가 넘는 파일은 일회용 업로드 주소를 받아서 올려야 한다.
            if ! url=$(vt "$api/files/upload_url" | jq -er .data); then
              echo "::warning::$name: 업로드 주소를 받지 못했습니다"; pause; continue
            fi
            pause
            if id=$(vt -F "file=@artifacts/$name" "$url" | jq -er .data.id); then
              analysis[$name]=$id
            else
              echo "::warning::$name: VirusTotal에 올리지 못했습니다"
            fi
            pause
          done

          # 검사는 파일마다 몇 분 걸린다. 최대 약 10분 기다리고, 끝나지 않은 파일은 숫자 없이 링크만 단다.
          for round in $(seq 1 12); do
            pending=0
            for entry in "${files[@]}"; do
              name=${entry%%|*}
              if [ -z "${analysis[$name]:-}" ] || [ -n "${result[$name]:-}" ]; then continue; fi
              if resp=$(vt "$api/analyses/${analysis[$name]}") \
                && [ "$(jq -r .data.attributes.status <<<"$resp")" = completed ]; then
                # 판정을 낸 엔진만 센다(파일 형식을 못 읽은 엔진은 빼서 VirusTotal 화면의 "0 / 61"과 같게).
                result[$name]=$(jq -r '.data.attributes.stats
                  | "\(.malicious + .suspicious) \(.malicious + .suspicious + .undetected + .harmless)"' <<<"$resp")
              else
                pending=1
              fi
              pause
            done
            [ "$pending" -eq 0 ] && break
          done

          warnings=()
          {
            echo "## 백신 검사 결과 (VirusTotal)"
            echo
            echo "서명하지 않은 앱이라 설치할 때 경고가 뜰 수 있습니다. 아래 파일을 여러 백신으로 검사한 결과를 확인할 수 있습니다."
            echo
            for entry in "${files[@]}"; do
              name=${entry%%|*}; label=${entry#*|}
              link="https://www.virustotal.com/gui/file/$(sha256sum "artifacts/$name" | cut -d' ' -f1)"
              if [ -n "${result[$name]:-}" ]; then
                read -r hits total <<<"${result[$name]}"
                if [ "$hits" -gt 0 ]; then warnings+=("$name: $total개 엔진 중 $hits개가 탐지했습니다"); fi
                echo "- **$label** \`$name\` — [${total}개 엔진 중 탐지 ${hits}]($link)"
              else
                echo "- **$label** \`$name\` — [검사 결과]($link)"
              fi
            done
            echo
          } > VT_SECTION.md
          cat VT_SECTION.md
          # 탐지가 있어도 릴리즈는 낸다(본문에 숫자가 그대로 보인다). 실행 요약에 경고로 남겨 알아채게 한다.
          for w in "${warnings[@]}"; do echo "::warning::$w"; done

      # 릴리즈 본문 = 이전 태그 이후 커밋 제목 목록 + 설치 안내 + 백신 검사 결과(있으면).
      - name: Build release notes
        run: |
          tag="$GITHUB_REF_NAME"
          prev=$(git describe --tags --abbrev=0 --match 'v*' "$tag^" 2>/dev/null || true)
          if [ -n "$prev" ]; then
            range="$prev..$tag"
            compare="https://github.com/$GITHUB_REPOSITORY/compare/$prev...$tag"
          else
            range="$tag"
            compare="https://github.com/$GITHUB_REPOSITORY/commits/$tag"
          fi
          {
            echo "## 변경 사항"
            echo
            git log --no-merges --pretty='- %s' "$range"
            echo
            echo "## 설치"
            echo
            echo "**Windows** — \`Woodada.exe\`를 받아 원하는 폴더에 두고 실행하세요. 따로 설치할 것은 없습니다."
            echo "한 번 설치하면 앱이 켜져 있는 동안 6시간마다 새 버전을 확인해 자동으로 업데이트합니다."
            echo
            echo "**macOS** — 애플 실리콘(M1 이후)은 \`Woodada-mac-arm64.dmg\`, 인텔 맥은 \`Woodada-mac-x64.dmg\`를 받아"
            echo "열고 Woodada를 응용 프로그램 폴더로 끌어다 놓으세요. Apple 개발자 서명이 없어 처음 열 때 경고가 뜹니다."
            echo "그러면 시스템 설정 → 개인정보 보호 및 보안에서 \"그래도 열기\"를 누르세요."
            echo "그다음부터는 6시간마다 새 버전을 확인해 자동으로 업데이트합니다."
            echo "\`auto-update-\`로 시작하는 파일은 앱이 자동 업데이트에 쓰는 파일이라 받지 않아도 됩니다."
            echo
            if [ -f VT_SECTION.md ]; then cat VT_SECTION.md; fi
            echo "고양이 이미지는 [RunCat365](https://github.com/runcat-dev/RunCat365)에서 가져왔으며 [Apache License 2.0](https://github.com/$GITHUB_REPOSITORY/blob/$tag/app/src/Woodada/Assets/RunCat/LICENSE)을 따릅니다."
            echo "냥뽑기 스페셜 스킨과 닥스훈트·토끼 디자인은 MIT License 적용 대상이 아니며 [별도 조건](https://github.com/$GITHUB_REPOSITORY/blob/$tag/app/src/Woodada/Sprites/Skins/LICENSE)을 따릅니다."
            echo
            echo "**전체 변경 내역**: $compare"
          } > RELEASE_BODY.md
          cat RELEASE_BODY.md >> "$GITHUB_STEP_SUMMARY"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          # 링크가 저장소 밖(커뮤니티·알림)에서 보여도 무슨 제품인지 알 수 있게 제목에 제품명을 붙인다.
          # 태그는 그대로 v1.2.3 형태라 자동 업데이트·홈페이지(tag_name을 읽음)에는 영향이 없다.
          name: Woodada ${{ github.ref_name }}
          files: |
            artifacts/Woodada.exe
            artifacts/Woodada-mac-arm64.dmg
            artifacts/Woodada-mac-x64.dmg
            artifacts/auto-update-mac-arm64.zip
            artifacts/auto-update-mac-x64.zip
          fail_on_unmatched_files: true
          body_path: RELEASE_BODY.md
